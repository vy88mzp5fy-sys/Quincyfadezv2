name: Android Bundle Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Validate Expo config
        run: npx expo config --type public
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-android-test
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
