name: Notification Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  notification-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - name: Install notification test dependencies
        run: |
          grep -v '^emergentintegrations==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Compile notification modules
        run: python -m py_compile notification_api.py notification_preferences.py push_delivery.py app.py
      - name: Run notification preference tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_notification_preferences.py
