name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: |
          grep -v '^emergentintegrations==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Compile backend modules
        run: python -m py_compile server.py app.py client_auth.py admin_api.py payment_policy.py
      - name: Run guarded payment policy tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_payment_policy.py

  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx expo config --type public
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir dist-test
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
